<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* Products Section */
        .products-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .product-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-price {
            color: #667eea;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .product-desc {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .add-to-cart-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .add-to-cart-btn:hover {
            opacity: 0.9;
        }

        /* Cart Section */
        .cart-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .cart-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .cart-items {
            margin-bottom: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 15px;
        }

        .cart-item-qty {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }

        .cart-item-price {
            font-weight: bold;
            color: #667eea;
            margin: 0 15px;
            min-width: 80px;
            text-align: right;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-btn:hover {
            background: #ee5a5a;
        }

        .cart-empty {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .cart-summary {
            border-top: 2px solid #eee;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cart-total {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .checkout-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .order-summary {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .order-summary h4 {
            margin-bottom: 12px;
            color: #333;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .summary-total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .submit-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .cancel-btn {
            flex: 1;
            background: #999;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #777;
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
        }

        .success {
            color: #51cf66;
            font-size: 13px;
            margin-top: 5px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            display: none;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .products-section {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html">Back to home</a>
    <div class="container">
        <div class="header">
            <h1>🛍️ My Store</h1>
            <p>Premium Products at Great Prices</p>
        </div>

        <!-- Products -->
        <div class="products-section" id="productsContainer"></div>

        <!-- Shopping Cart -->
        <div class="cart-section">
            <div class="cart-title">🛒 Shopping Cart</div>
            <div class="cart-items" id="cartItems">
                <div class="cart-empty">Your cart is empty</div>
            </div>
            <div class="cart-summary">
                <div class="cart-total">
                    Total: <span id="totalPrice">$0.00</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Checkout</span>
                <button class="close-btn" onclick="closeCheckout()">&times;</button>
            </div>

            <form id="checkoutForm" onsubmit="handleCheckout(event)">
                <!-- Customer Information -->
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                    <div class="error" id="fullNameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="address">Street Address *</label>
                    <input type="text" id="address" name="address" required>
                    <div class="error" id="addressError"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="postalCode">Postal Code *</label>
                        <input type="text" id="postalCode" name="postalCode" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <!-- Order Summary -->
                <div class="order-summary">
                    <h4>Order Summary</h4>
                    <div id="orderSummary"></div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="button" class="cancel-btn" onclick="closeCheckout()">Cancel</button>
                    <button type="submit" class="submit-btn">Confirm Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Sample Products
        const products = [
            { id: 1, name: 'Wireless Headphones', price: 79.99, emoji: '🎧', desc: 'Premium sound quality' },
            { id: 2, name: 'Smartphone', price: 699.99, emoji: '📱', desc: 'Latest technology' },
            { id: 3, name: 'Laptop', price: 1299.99, emoji: '💻', desc: 'Powerful performance' },
            { id: 4, name: 'Smartwatch', price: 299.99, emoji: '⌚', desc: 'Stay connected' },
            { id: 5, name: 'Tablet', price: 449.99, emoji: '📲', desc: 'Perfect for work & play' },
            { id: 6, name: 'Camera', price: 899.99, emoji: '📷', desc: 'Capture memories' }
        ];

        let cart = [];

        // Load Products
        function loadProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="product-desc">${product.desc}</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            updateCart();
            showToast(`${product.name} added to cart!`);
        }

        // Update Cart Display
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const totalPrice = document.getElementById('totalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
                checkoutBtn.disabled = true;
                totalPrice.textContent = '$0.00';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-qty">Quantity: ${item.quantity}</div>
                        </div>
                        <div class="cart-item-price">$${itemTotal.toFixed(2)}</div>
                        <button type="button" class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                    </div>
                `;
            }).join('');

            totalPrice.textContent = `$${total.toFixed(2)}`;
            checkoutBtn.disabled = false;
        }

        // Remove from Cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
            showToast('Item removed from cart');
        }

        // Open Checkout
        function openCheckout() {
            document.getElementById('checkoutModal').classList.add('active');
            updateOrderSummary();
        }

        // Close Checkout
        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('active');
            document.getElementById('checkoutForm').reset();
            clearErrors();
        }

        // Update Order Summary
        function updateOrderSummary() {
            const summary = document.getElementById('orderSummary');
            let total = 0;

            const items = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `
                    <div class="summary-row">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            summary.innerHTML = `
                ${items}
                <div class="summary-row summary-total">
                    <span>Total:</span>
                    <span>$${total.toFixed(2)}</span>
                </div>
            `;
        }

        // Handle Checkout
        function handleCheckout(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // Validation
            if (!fullName) {
                document.getElementById('fullNameError').textContent = 'Full name is required';
                return;
            }

            if (!email || !email.includes('@')) {
                document.getElementById('emailError').textContent = 'Valid email is required';
                return;
            }

            if (!address) {
                document.getElementById('addressError').textContent = 'Address is required';
                return;
            }

            // Calculate total
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            // Prepare order data
            const orderData = {
                name: fullName,
                email: email,
                address: address,
                city: city,
                postalCode: postalCode,
                phone: phone,
                items: cart,
                total: total.toFixed(2)
            };

            // Save to local storage (optional)
            localStorage.setItem('lastOrder', JSON.stringify(orderData));

            // Display order confirmation
            displayOrderConfirmation(orderData);
        }

        // Display Order Confirmation
        function displayOrderConfirmation(orderData) {
            const message = `
Order Confirmed!

Name: ${orderData.name}
Email: ${orderData.email}
Address: ${orderData.address}
City: ${orderData.city}
Postal Code: ${orderData.postalCode}
Phone: ${orderData.phone}

Total: $${orderData.total}

A confirmation email will be sent to ${orderData.email}
            `;

            alert(message);
            
            // Close modal and clear cart
            closeCheckout();
            cart = [];
            updateCart();
            showToast('✅ Order confirmed successfully!');
        }

        // Clear Errors
        function clearErrors() {
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
        }

        // Show Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Event Listener
        document.getElementById('checkoutBtn').addEventListener('click', openCheckout);

        // Initialize
        loadProducts();
    </script>
</body>
</html>
